<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>নাটোর অর্গানিক শপ - ড্যাশবোর্ড</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --p: #007bff; --s: #28a745; --d: #dc3545; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); margin: 0; padding: 10px; font-size: 14px; }
        
        /* পারমিশন নোটিশ */
        .no-permission {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: #dc3545; color: white; padding: 12px 25px; border-radius: 30px;
            display: none; z-index: 9999; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .header { background: #1a1a1a; color: white; padding: 15px; text-align: center; margin: -10px -10px 15px; font-weight: bold; font-size: 18px; }
        
        /* ড্যাশবোর্ড গ্রিড */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .stat-card { background: #fff; padding: 25px 10px; border-radius: 12px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); cursor: pointer; border: 1px solid #eee; }
        .stat-card h2 { margin: 0; font-size: 30px; font-weight: bold; }

        /* লিস্ট উইন্ডো */
        .view-window { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f8f9fa; z-index: 1500; overflow-y: auto; padding: 10px; box-sizing: border-box; }
        .back-bar { background: #fff; padding: 12px; margin: -10px -10px 15px; display: flex; align-items: center; position: sticky; top: 0; z-index: 1600; box-shadow: 0 2px 5px rgba(0,0,0,0.1); gap: 15px; }
        
        .order-card-view { background: #fff; border-radius: 15px; padding: 18px; margin-bottom: 15px; border: 1px solid #eee; }
        .action-row { display: flex; align-items: center; margin-top: 15px; gap: 10px; }
        .btn-icon { width: 42px; height: 42px; border-radius: 10px; color: white; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 18px; }
        .btn-details { background: #007bff; color: white; border: none; padding: 10px 22px; border-radius: 10px; font-weight: bold; margin-left: auto; cursor: pointer; }

        /* পপআপ (অর্ডার কন্ট্রোল) - ট্রাকিং আইডি রিমুভ করা হয়েছে */
        .modal { display: none; position: fixed; z-index: 3000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(3px); }
        .modal-content { background: white; margin: 12% auto; padding: 25px; border-radius: 25px; width: 88%; max-width: 380px; text-align: center; }
        .info-box { background: #fdfdfd; border: 1.5px solid #eee; border-radius: 15px; padding: 20px; text-align: left; margin: 15px 0; font-size: 15px; line-height: 1.7; color: #333; }
        
        .m-btn { width: 100%; padding: 14px; margin: 6px 0; border: none; border-radius: 12px; font-weight: bold; font-size: 15px; cursor: pointer; color: white; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-save { background: #007bff; }
        .btn-delv { background: #28a745; }
        .btn-canc { background: #dc3545; }
        .btn-dele { background: #000; }
        .btn-clos { background: #f1f3f5; color: #444; margin-top: 10px; }
    </style>
</head>
<body>

<div id="permissionMsg" class="no-permission">এডমিনের পারমিশন প্রয়োজন!</div>

<div id="mainApp">
    <div class="header">নাটোর অর্গানিক শপ</div>
    <div class="stats-grid" id="statsGrid">
        </div>
</div>

<div id="viewWindow" class="view-window">
    <div class="back-bar">
        <button onclick="closeView()" style="background:#333; color:white; border:none; padding:10px 18px; border-radius:8px;">← ফিরে যান</button>
        <div id="viewBadge" style="background:#eee; padding:5px 12px; border-radius:8px; font-weight:bold;">0</div>
    </div>
    <div id="viewContent"></div>
</div>

<div id="controlModal" class="modal">
    <div class="modal-content">
        <h3 style="margin:0; font-size:20px;">অর্ডার কন্ট্রোল</h3>
        
        <div id="modalInfo" class="info-box"></div>

        <button class="m-btn btn-save" onclick="showDenied()">সেভ করুন</button>
        <button class="m-btn btn-delv" onclick="showDenied()"><i class="fas fa-check"></i> ডেলিভারি</button>
        <button class="m-btn btn-canc" onclick="showDenied()"><i class="fas fa-times"></i> ক্যানসেল</button>
        <button class="m-btn btn-dele" onclick="showDenied()"><i class="fas fa-trash-alt"></i> ডিলিট</button>
        <button class="m-btn btn-clos" onclick="closeModal()">বন্ধ করুন</button>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://natore-organic-shop-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let allOrders = [], currentView = 'Main';

    db.ref('orders').on('value', snap => {
        const data = snap.val();
        allOrders = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })).sort((a,b) => b.timestamp - a.timestamp) : [];
        renderStats();
        if(currentView !== 'Main') refreshCurrentView();
    });

    function renderStats() {
        const counts = allOrders.reduce((acc, o) => {
            acc.total++;
            if(o.status === 'Delivered') acc.del++;
            else if(o.status === 'Cancelled') acc.can++;
            else acc.pen++;
            return acc;
        }, {total:0, del:0, pen:0, can:0});

        const grid = document.getElementById('statsGrid');
        grid.innerHTML = `
            <div class="stat-card" onclick="openView('All')"><h4>মোট</h4><h2>${counts.total}</h2></div>
            <div class="stat-card" onclick="openView('Delivered')"><h4>ডেলিভারি</h4><h2 style="color:#28a745;">${counts.del}</h2></div>
            <div class="stat-card" onclick="openView('Pending')"><h4>পেন্ডিং</h4><h2 style="color:#ff9800;">${counts.pen}</h2></div>
            <div class="stat-card" onclick="openView('Cancelled')"><h4>ক্যানসেল</h4><h2 style="color:#dc3545;">${counts.can}</h2></div>
        `;
    }

    function openView(s) {
        currentView = s;
        document.getElementById('viewWindow').style.display = 'block';
        refreshCurrentView();
    }

    function refreshCurrentView() {
        const container = document.getElementById('viewContent');
        container.innerHTML = "";
        let filtered = (currentView === 'All') ? allOrders : allOrders.filter(o => o.status === currentView);
        document.getElementById('viewBadge').innerText = filtered.length;

        filtered.forEach(o => {
            const card = document.createElement('div');
            card.className = 'order-card-view';
            card.innerHTML = `
                <div style="font-weight:bold; font-size:17px;">${o.name} (${o.weightCount || 1})</div>
                <div style="color:#007bff; font-weight:bold; margin:8px 0;">📞 ${o.phone}</div>
                <div class="action-row">
                    <a href="tel:${o.phone}" class="btn-icon" style="background:#007bff"><i class="fas fa-phone"></i></a>
                    <a href="whatsapp://send?phone=88${o.phone}" class="btn-icon" style="background:#25d366"><i class="fab fa-whatsapp"></i></a>
                    <button class="btn-details" onclick="openControl('${o.id}')">বিস্তারিত</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function openControl(id) {
        const order = allOrders.find(o => o.id === id);
        if(!order) return;
        
        const detailsText = `
            <b>${order.phone}</b>
            <b>${order.name}</b>
            ${order.address || 'ঠিকানা পাওয়া যায়নি'}
            ${order.product || 'পণ্যের নাম নেই'}
            ${order.weightCount || 0} কেজি = ${order.price || 0} টাকা
        `.trim();

        document.getElementById('modalInfo').innerHTML = detailsText.replace(/\n/g, '<br>');
        document.getElementById('controlModal').style.display = 'block';
    }

    function showDenied() {
        const msg = document.getElementById('permissionMsg');
        msg.style.display = 'block';
        setTimeout(() => { msg.style.display = 'none'; }, 2000);
    }

    function closeModal() { document.getElementById('controlModal').style.display = 'none'; }
    function closeView() { currentView = 'Main'; document.getElementById('viewWindow').style.display = 'none'; }
</script>
</body>
</html>
