<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>নাটোর অর্গানিক শপ - লাইভ প্যানেল</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f7; margin: 0; padding: 10px; }
        .header { background: #3f51b5; color: white; text-align: center; padding: 15px; border-radius: 8px; margin-bottom: 15px; font-weight: bold; }
        
        /* ড্যাশবোর্ড গ্রিড */
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-box { background: white; padding: 15px; border-radius: 12px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-bottom: 5px solid #ccc; cursor: pointer; }
        .stat-box h3 { margin: 0; font-size: 13px; color: #666; }
        .stat-box .count { font-size: 24px; font-weight: bold; margin: 5px 0; }
        .total { border-color: #2196f3; } .delivered { border-color: #4caf50; }
        .pending { border-color: #ffc107; } .cancelled { border-color: #f44336; }

        /* ইনপুট বক্স */
        .input-section { background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        textarea { width: 100%; height: 80px; border: 1px solid #ddd; border-radius: 8px; padding: 10px; box-sizing: border-box; }
        .submit-btn { width: 100%; background: #2ecc71; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; margin-top: 10px; }

        /* লিস্ট পেজ */
        #listPage { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f0f4f7; z-index: 1000; overflow-y: auto; padding: 15px; box-sizing: border-box; }
        .back-nav { background: #333; color: white; padding: 8px 15px; border-radius: 5px; cursor: pointer; display: inline-block; margin-bottom: 15px; }
        .order-card { background: white; padding: 15px; margin-bottom: 10px; border-radius: 10px; border-left: 5px solid #3f51b5; box-shadow: 0 1px 4px rgba(0,0,0,0.1); position: relative; }
        
        /* বিকল্প অপশন পপ-আপ */
        #optionModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2000; }
        .modal-content { background: white; margin: 15% auto; width: 90%; border-radius: 15px; padding: 20px; text-align: center; }
        .opt-btn { width: 100%; padding: 12px; margin: 5px 0; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="mainDashboard">
    <div class="header">নাটোর অর্গানিক শপ</div>
    <div class="dashboard-grid">
        <div class="stat-box total" onclick="showList('Total')"><h3>মোট</h3><div id="totalCnt" class="count">0</div></div>
        <div class="stat-box delivered" onclick="showList('Delivered')"><h3>ডেলিভারি</h3><div id="delCnt" class="count">0</div></div>
        <div class="stat-box pending" onclick="showList('Pending')"><h3>পেন্ডিং</h3><div id="penCnt" class="count">0</div></div>
        <div class="stat-box cancelled" onclick="showList('Cancelled')"><h3>ক্যান্সেল</h3><div id="canCnt" class="count">0</div></div>
    </div>
    <div class="input-section">
        <textarea id="orderInput" placeholder="WhatsApp থেকে অর্ডার পেস্ট করুন..."></textarea>
        <button class="submit-btn" onclick="saveOrder()">অর্ডার জমা দিন</button>
    </div>
</div>

<div id="listPage">
    <div class="back-nav" onclick="closeList()">← পিছনে যান</div>
    <div id="orderContainer"></div>
</div>

<div id="optionModal">
    <div class="modal-content">
        <h3 id="optName">গ্রাহকের নাম</h3>
        <button class="opt-btn" style="background:#4caf50" onclick="updateStatus('Delivered')">✓ ডেলিভারি সম্পন্ন</button>
        <button class="opt-btn" style="background:#f44336" onclick="updateStatus('Cancelled')">✕ অর্ডার ক্যান্সেল</button>
        <button class="opt-btn" style="background:#7f8c8d" onclick="updateStatus('Pending')">↺ রিসেট (পেন্ডিং)</button>
        <button class="opt-btn" style="background:#ff4757" onclick="deleteOrder()">🗑 ডিলিট করুন</button>
        <button class="opt-btn" style="background:#eee; color:#333" onclick="closeModal()">বন্ধ করুন</button>
    </div>
</div>

<script>
    // আপনার ফায়ারবেস কনফিগারেশন
    const firebaseConfig = {
      apiKey: "AIzaSyBWkpDbwjV0R8g_sdcKC1gwml71yR4PCps",
      authDomain: "natore-organic-shop.firebaseapp.com",
      databaseURL: "https://natore-organic-shop-default-rtdb.firebaseio.com",
      projectId: "natore-organic-shop",
      storageBucket: "natore-organic-shop.firebasestorage.app",
      messagingSenderId: "227197796935",
      appId: "1:227197796935:web:4aeb91a1ba1021a093a762"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref('orders');
    let currentOrderId = null;

    function saveOrder() {
        const text = document.getElementById('orderInput').value;
        const entries = text.split(/\[\d+\/\d+,\s\d+:\d+\s[APM]+\]\s[^:]+:/).filter(e => e.trim() !== "");
        entries.forEach(entry => {
            const lines = entry.trim().split('\n');
            db.push({ phone: lines[0], name: lines[1] || "নাম নেই", info: lines.slice(2).join(', '), status: "Pending" });
        });
        document.getElementById('orderInput').value = "";
    }

    db.on('value', snap => {
        const data = snap.val();
        let counts = { Total: 0, Delivered: 0, Pending: 0, Cancelled: 0 };
        let html = "";
        if(data) {
            Object.keys(data).reverse().forEach(id => {
                const o = data[id];
                counts.Total++;
                counts[o.status]++;
                html += `<div class="order-card" onclick="openOptions('${id}', '${o.name}')">
                    <strong>${o.name} (${o.status})</strong><br><span>📞 ${o.phone}</span><br>
                    <button class="opt-btn" style="background:#1a73e8; padding:5px; font-size:12px;" onclick="event.stopPropagation(); window.open('https://steadfast.com.bd/t/${o.phone}', '_blank')">লাইভ ট্র্যাকিং</button>
                </div>`;
            });
        }
        document.getElementById('totalCnt').innerText = counts.Total;
        document.getElementById('delCnt').innerText = counts.Delivered;
        document.getElementById('penCnt').innerText = counts.Pending;
        document.getElementById('canCnt').innerText = counts.Cancelled;
        document.getElementById('orderContainer').innerHTML = html;
    });

    function openOptions(id, name) { currentOrderId = id; document.getElementById('optName').innerText = name; document.getElementById('optionModal').style.display = 'block'; }
    function closeModal() { document.getElementById('optionModal').style.display = 'none'; }
    function updateStatus(status) { db.child(currentOrderId).update({ status }); closeModal(); }
    function deleteOrder() { if(confirm("ডিলিট করবেন?")) { db.child(currentOrderId).remove(); closeModal(); } }
    function showList() { document.getElementById('mainDashboard').style.display='none'; document.getElementById('listPage').style.display='block'; }
    function closeList() { document.getElementById('listPage').style.display='none'; document.getElementById('mainDashboard').style.display='block'; }
</script>
</body>
</html>
