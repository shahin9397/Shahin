<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>নাটোর অর্গানিক শপ - ড্যাশবোর্ড</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f7; margin: 0; padding: 10px; }
        .header { background: #3f51b5; color: white; text-align: center; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .box { background: white; padding: 15px; border-radius: 12px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-bottom: 5px solid #ccc; cursor: pointer; }
        .count { font-size: 24px; font-weight: bold; margin: 5px 0; }
        .total { border-color: #2196f3; } .delivered { border-color: #4caf50; }
        .pending { border-color: #ffc107; } .cancelled { border-color: #f44336; }
        .input-area { background: white; padding: 15px; border-radius: 12px; }
        textarea { width: 100%; height: 80px; border: 1px solid #ddd; border-radius: 8px; padding: 10px; box-sizing: border-box; }
        .btn { width: 100%; background: #2ecc71; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; margin-top: 10px; }
        #listPage { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f0f4f7; z-index: 1000; overflow-y: auto; padding: 15px; box-sizing: border-box; }
        .back-nav { background: #333; color: white; padding: 8px 15px; border-radius: 5px; cursor: pointer; display: inline-block; margin-bottom: 15px; }
        .card { background: white; padding: 15px; margin-bottom: 10px; border-radius: 10px; border-left: 5px solid #3f51b5; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; }
        .modal-content { background: white; margin: 20% auto; width: 85%; border-radius: 15px; padding: 20px; text-align: center; }
        .opt { width: 100%; padding: 12px; margin: 5px 0; border: none; border-radius: 8px; color: white; font-weight: bold; }
    </style>
</head>
<body>

<div id="main">
    <div class="header">নাটোর অর্গানিক শপ</div>
    <div class="grid">
        <div class="box total" onclick="showList()"><h3>মোট</h3><div id="tCnt" class="count">0</div></div>
        <div class="box delivered" onclick="showList()"><h3>ডেলিভারি</h3><div id="dCnt" class="count">0</div></div>
        <div class="box pending" onclick="showList()"><h3>পেন্ডিং</h3><div id="pCnt" class="count">0</div></div>
        <div class="box cancelled" onclick="showList()"><h3>ক্যান্সেল</h3><div id="cCnt" class="count">0</div></div>
    </div>
    <div class="input-area">
        <textarea id="inp" placeholder="WhatsApp থেকে অর্ডার পেস্ট করুন..."></textarea>
        <button class="btn" onclick="add()">অর্ডার জমা দিন</button>
    </div>
</div>

<div id="listPage">
    <div class="back-nav" onclick="hideList()">← পিছনে যান</div>
    <div id="list"></div>
</div>

<div id="modal">
    <div class="modal-content">
        <h3 id="mName">অর্ডার অপশন</h3>
        <button class="opt" style="background:#4caf50" onclick="upd('Delivered')">✓ ডেলিভারি সম্পন্ন</button>
        <button class="opt" style="background:#f44336" onclick="upd('Cancelled')">✕ অর্ডার ক্যান্সেল</button>
        <button class="opt" style="background:#ff4757" onclick="del()">🗑 ডিলিট করুন</button>
        <button class="opt" style="background:#777" onclick="document.getElementById('modal').style.display='none'">বন্ধ করুন</button>
    </div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyBWkpDbwjV0R8g_sdcKC1gwml71yR4PCps",
      authDomain: "natore-organic-shop.firebaseapp.com",
      databaseURL: "https://natore-organic-shop-default-rtdb.firebaseio.com",
      projectId: "natore-organic-shop",
      storageBucket: "natore-organic-shop.firebasestorage.app",
      messagingSenderId: "227197796935",
      appId: "1:227197796935:web:4aeb91a1ba1021a093a762"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref('orders');
    let selId = null;

    function add() {
        const text = document.getElementById('inp').value;
        const entries = text.split(/\[\d+\/\d+,\s\d+:\d+\s[APM]+\]\s[^:]+:/).filter(e => e.trim() !== "");
        entries.forEach(e => {
            const lines = e.trim().split('\n');
            db.push({ phone: lines[0], name: lines[1] || "নাম নেই", status: "Pending" });
        });
        document.getElementById('inp').value = "";
    }

    db.on('value', snap => {
        const data = snap.val();
        let c = { Total: 0, Delivered: 0, Pending: 0, Cancelled: 0 }, h = "";
        if(data) {
            Object.keys(data).reverse().forEach(id => {
                const o = data[id];
                c.Total++; c[o.status]++;
                h += `<div class="card" onclick="openM('${id}', '${o.name}')">
                    <strong>${o.name} (${o.status})</strong><br><span>📞 ${o.phone}</span><br>
                    <button class="opt" style="background:#1a73e8; padding:5px; font-size:12px; width:auto; margin-top:5px;" onclick="event.stopPropagation(); window.open('https://steadfast.com.bd/t/${o.phone}', '_blank')">লাইভ ট্র্যাকিং</button>
                </div>`;
            });
        }
        document.getElementById('tCnt').innerText = c.Total;
        document.getElementById('dCnt').innerText = c.Delivered;
        document.getElementById('pCnt').innerText = c.Pending;
        document.getElementById('cCnt').innerText = c.Cancelled;
        document.getElementById('list').innerHTML = h;
    });

    function openM(id, name) { selId = id; document.getElementById('mName').innerText = name; document.getElementById('modal').style.display = 'block'; }
    function upd(s) { db.child(selId).update({ status: s }); document.getElementById('modal').style.display = 'none'; }
    function del() { if(confirm("ডিলিট করবেন?")) { db.child(selId).remove(); document.getElementById('modal').style.display = 'none'; } }
    function showList() { document.getElementById('main').style.display='none'; document.getElementById('listPage').style.display='block'; }
    function hideList() { document.getElementById('listPage').style.display='none'; document.getElementById('main').style.display='block'; }
</script>
</body>
</html>
